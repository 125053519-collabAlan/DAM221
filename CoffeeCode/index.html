<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Caja Registradora</title>
    <style>
      .contenedor {
    width: 800px;
    margin: 30px auto;
}

.seccion {
    border: 2px solid black;
    padding: 20px;
    margin: 20px 0;
    border-radius: 10px;
}
    </style>
</head>

<body>
<div class="contenedor">
    <div class="seccion">
     <center><h1>CAFETERÍA</h1></center>
    <h1>Caja Registradora</h1>

    <label>Producto:</label>
    <input type="text" id="producto">

    <br><br>

    <label>Precio:</label>
    <input type="number" id="precio">

    <br><br>

    <button onclick="agregarPedido()">Agregar pedido</button>

    <h2>Lista de pedidos</h2>

    <ul id="listaPedidos"></ul>

    <h2>Total acumulado: $<span id="total">0</span></h2>
    </div>
</div>

    <script>

        const pedidos = [];
        let total = 0;

        function agregarPedido() {

            const producto = document.getElementById("producto").value;
            const precio = Number(document.getElementById("precio").value);

            if (producto == "" || precio <= 0) {
                alert("Escribe un producto y un precio válido");
                return;
            }

            pedidos.push(producto);
            total = total + precio;

            mostrarPedidos();

            document.getElementById("producto").value = "";
            document.getElementById("precio").value = "";
        }


        function mostrarPedidos() {

            const lista = document.getElementById("listaPedidos");

            lista.innerHTML = "";

            for (let i = 0; i < pedidos.length; i++) {

                const elemento = document.createElement("li");

                elemento.textContent = pedidos[i];

                lista.appendChild(elemento);
            }

            document.getElementById("total").textContent = total;
        }

    </script>
<div class="contenedor">

       


        
        <div class="seccion">

            <h2>Cliente</h2>

            <button onclick="consultarProductos()">
                Consultar productos
            </button>

            <button onclick="crearPedido()">
                Crear pedido
            </button>

            <button onclick="consultarPedidos()">
                Consultar pedido
            </button>

            <button onclick="listarPedidos()">
                Listar pedidos
            </button>

        </div>
        <div id="resultado">

        </div>

        </div>
    <script src="Menu.js"></script>

</body>
</html>
